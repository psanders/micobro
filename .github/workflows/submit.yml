name: Submit to stores

# Sends an existing release's store bundles to App Store Connect (TestFlight)
# and/or Google Play, with `eas submit`. Manual only: pick the vX.Y.Z tag
# whose GitHub Release holds the .ipa/.aab built by release.yml.
#
#   - iOS: uses the App Store Connect API key stored in EAS (`ascAppId` in
#     eas.json). Lands in TestFlight; submitting for review stays a manual
#     click in App Store Connect.
#   - Android: needs the GOOGLE_SERVICE_ACCOUNT_KEY repo secret (Play Console
#     -> API access, "Release manager"). Uploads to the internal track as a
#     draft. Google requires the very first AAB to be uploaded by hand in Play
#     Console; use this for every upload after that.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.16.0)"
        required: true
      platform:
        description: "Which store"
        type: choice
        options: [ios, android, both]
        default: ios

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download the release bundles
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          gh release download "$TAG" --pattern '*.ipa' --pattern '*.aab' --dir "$RUNNER_TEMP/bundles"
          ls -la "$RUNNER_TEMP/bundles"

      - name: Submit iOS to App Store Connect
        if: ${{ inputs.platform != 'android' }}
        run: |
          eas submit --platform ios --profile production --non-interactive \
            --path "$RUNNER_TEMP/bundles/micobro-$TAG-ios.ipa"

      - name: Submit Android to Google Play (internal, draft)
        if: ${{ inputs.platform != 'ios' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY is not set (Play Console -> API access)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
          eas submit --platform android --profile production --non-interactive \
            --path "$RUNNER_TEMP/bundles/micobro-$TAG-android.aab"
