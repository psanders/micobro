name: Release

# One release pipeline for both platforms.
#
# On every push to main, semantic-release inspects the commits since the last
# vX.Y.Z tag and, if any are releasable (feat -> minor, fix/copy/design ->
# patch, BREAKING CHANGE -> major — see release.config.js), bumps
# package.json, writes CHANGELOG.md, commits "chore(release): vX.Y.Z
# [skip ci]", tags it, and publishes a GitHub Release. The `android` and
# `ios` jobs then build the store bundles for that exact tag and attach them
# to that same Release:
#
#   - micobro-vX.Y.Z-android.aab  — Play Store (upload key: EAS-managed)
#   - micobro-vX.Y.Z-android.apk  — direct install / sideload
#   - micobro-vX.Y.Z-ios.ipa      — App Store distribution
#
# Store submission is manual: download the bundle from the Release and upload
# it to Play Console / App Store Connect (or `eas submit --path <file>`).
#
# Why one workflow with platform jobs, not a tag-triggered build: the release
# tag is pushed with the default GITHUB_TOKEN, and GitHub does not run
# workflows for tags pushed by GITHUB_TOKEN. Keeping the builds as jobs in
# this same run sidesteps that entirely — no PAT needed.
#
# workflow_dispatch builds the same store bundles off an arbitrary branch or
# tag (e.g. to hand a customer a pre-merge build). It does not bump the
# version or create a Release — the bundles are uploaded as 30-day workflow
# artifacts instead. This replaces the old standalone "Release Android APK"
# workflow.
#
# The builds use `eas build --local`: they compile on the runner and consume
# zero EAS build quota, but EAS still owns Apple/Android signing — --local
# pulls the credentials registered with EAS via EXPO_TOKEN, so no certs or
# keystores live in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to cut a release at (no leading v). Blank = build store bundles from `ref` only, no tag/Release."
        required: false
        default: ""
      ref:
        description: "Branch or tag to build store bundles from (blank = default branch). Ignored when `version` is set — that always releases from main."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Cut the release. Two paths:
  #   - push to main         -> semantic-release decides from the commits
  #   - workflow_dispatch +  -> cut exactly that version (the off-cycle escape
  #     a `version` input        hatch; validates, bumps, tags, publishes)
  # On a workflow_dispatch with no `version`, this job is skipped and the
  # android/ios jobs just build store bundles as run artifacts.
  # ---------------------------------------------------------------------------
  version:
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.out.outputs.released }}
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # ---- push: let semantic-release analyse the commits ----
      - name: Semantic release
        if: github.event_name == 'push'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

          # semantic-release tags the release commit it just created, so a
          # vX.Y.Z tag sitting on HEAD is the signal that this push actually
          # shipped a release — as opposed to one it analysed and skipped.
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$TAG" ]; then
            echo "Published $TAG — the android and ios jobs will build and attach the bundles."
            {
              echo "released=true"
              echo "version=${TAG#v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No release published for this push — skipping the platform builds."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- workflow_dispatch + version: cut exactly that version off main ----
      - name: Manual release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        id: manual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z (got '$V')"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "::error::tag v$V already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$V" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore(release): v$V [skip ci]"
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"
          gh release create "v$V" --verify-tag --title "Micobro v$V" --generate-notes
          {
            echo "released=true"
            echo "version=$V"
          } >> "$GITHUB_OUTPUT"

      - name: Collect release outputs
        id: out
        run: |
          RELEASED="${{ steps.semantic.outputs.released || steps.manual.outputs.released || 'false' }}"
          VERSION="${{ steps.semantic.outputs.version || steps.manual.outputs.version }}"
          {
            echo "released=$RELEASED"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android: AAB (Play Store) + APK (sideload), signed with the EAS-managed
  # upload key. Always uploaded as 30-day run artifacts; also attached to the
  # GitHub Release whenever one exists for the resolved tag.
  # ---------------------------------------------------------------------------
  android:
    needs: version
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (needs.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Two sequential `eas build --local` runs (AAB then APK) take ~65 min.
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
      # eas build --local runs sharp on the runner; use its prebuilt binary
      # rather than a global libvips (mirrors ../mikro's eas.json profiles).
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # A cut release (push or manual `version`) always builds from its
          # tag; a bare dispatch builds from `ref`, else the default branch.
          ref: ${{ (needs.version.outputs.version && format('v{0}', needs.version.outputs.version)) || inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Keyed on package.json + app.config.ts because expo prebuild (run
      # inside `eas build --local`) generates build.gradle from those.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'app.config.ts', 'package-lock.json') }}
          restore-keys: gradle-

      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: m2-

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The Expo template's Gradle memory defaults (-Xmx2048m / metaspace
      # 512m) OOM on the expo-updates Kotlin/KSP compile on a 16 GB runner.
      # `eas build --local` runs prebuild in a managed dir we can't sed after
      # the fact, so raise the limits in the user-level gradle.properties
      # Gradle merges on top of the generated project file.
      - name: Raise Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

      # A cut release (push or manual `version`) -> its tag. A dispatch whose
      # `ref` is itself a vX.Y.Z tag -> that tag verbatim, so re-running the
      # build for an existing release re-attaches to it. Anything else -> a
      # timestamped label; the bundles stay as run artifacts only.
      - name: Resolve tag
        run: |
          if [ -n "${{ needs.version.outputs.version }}" ]; then
            TAG="v${{ needs.version.outputs.version }}"
          elif printf '%s' "${{ inputs.ref }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAG="${{ inputs.ref }}"
          else
            REF="${{ inputs.ref || github.ref_name }}"
            TAG="${REF//\//-}-$(date +%Y%m%d-%H%M)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build AAB (Play Store)
        run: |
          eas build --platform android --profile production --local \
            --non-interactive --output "$RUNNER_TEMP/micobro-$TAG-android.aab"

      - name: Build APK (sideload)
        run: |
          eas build --platform android --profile production-apk --local \
            --non-interactive --output "$RUNNER_TEMP/micobro-$TAG-android.apk"

      # Runs on success or failure (not on cancel) so a finished AAB still
      # gets saved even if the APK build later fails.
      - name: Upload bundles as workflow artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: micobro-${{ env.TAG }}-android
          path: |
            ${{ runner.temp }}/micobro-${{ env.TAG }}-android.aab
            ${{ runner.temp }}/micobro-${{ env.TAG }}-android.apk
          retention-days: 30
          if-no-files-found: warn

      # Attach whenever a GitHub Release exists for this tag — covers both a
      # freshly cut release and a re-run against an existing tag.
      - name: Attach bundles to the GitHub Release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release '$TAG' — leaving the bundles as run artifacts only."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" \
              "$RUNNER_TEMP/micobro-$TAG-android.aab" \
              "$RUNNER_TEMP/micobro-$TAG-android.apk" --clobber; then
              exit 0
            fi
            echo "Upload to $TAG failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          echo "::error::Could not attach Android bundles to release $TAG"
          exit 1

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### 📦 Android — $TAG"
            echo "- \`micobro-$TAG-android.aab\` — Play Store upload"
            echo "- \`micobro-$TAG-android.apk\` — direct install / sideload"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # iOS: App Store distribution IPA, signed with the EAS-managed distribution
  # certificate + provisioning profile for com.micobro.app.
  # ---------------------------------------------------------------------------
  ios:
    needs: version
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (needs.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    # pod install + xcodebuild via eas build --local regularly take 40-60 min.
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # A cut release (push or manual `version`) always builds from its
          # tag; a bare dispatch builds from `ref`, else the default branch.
          ref: ${{ (needs.version.outputs.version && format('v{0}', needs.version.outputs.version)) || inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Keyed on the inputs `expo prebuild` generates the Podfile from — the
      # Podfile itself doesn't exist until the build runs.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ hashFiles('package.json', 'package-lock.json', 'app.config.ts') }}
          restore-keys: pods-

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # See the android job's Resolve tag step for the rationale.
      - name: Resolve tag
        run: |
          if [ -n "${{ needs.version.outputs.version }}" ]; then
            TAG="v${{ needs.version.outputs.version }}"
          elif printf '%s' "${{ inputs.ref }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAG="${{ inputs.ref }}"
          else
            REF="${{ inputs.ref || github.ref_name }}"
            TAG="${REF//\//-}-$(date +%Y%m%d-%H%M)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build IPA (App Store distribution)
        run: |
          eas build --platform ios --profile production --local \
            --non-interactive --output "$RUNNER_TEMP/micobro-$TAG-ios.ipa"

      - name: Upload IPA as a workflow artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: micobro-${{ env.TAG }}-ios
          path: ${{ runner.temp }}/micobro-${{ env.TAG }}-ios.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Attach IPA to the GitHub Release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release '$TAG' — leaving the IPA as a run artifact only."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$RUNNER_TEMP/micobro-$TAG-ios.ipa" --clobber; then
              exit 0
            fi
            echo "Upload to $TAG failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          echo "::error::Could not attach the IPA to release $TAG"
          exit 1

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### 📦 iOS — $TAG"
            echo "- \`micobro-$TAG-ios.ipa\` — App Store distribution"
            echo "- Submit: \`eas submit --platform ios --path <ipa>\` or upload in App Store Connect"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
