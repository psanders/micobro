# Covers: Crédito Abierto -> Cobrar -> "Solo abono" unlocking once the
# cycle's interest is covered (openspec change 103-solo-capital).
#
# Requires a mock-repo build (EXPO_PUBLIC_USE_MOCK_REPOS=true) — see the
# comment in pin-unlock.yaml. Uses Luis Pérez's loan-11
# (lib/repo/mock/fixtures.ts): crédito abierto, principal 1,000,000 cents at
# 500 bps weekly, started 21 days ago with interest-only payments on cycles 1
# and 2. That leaves the CURRENT cycle's interest UNPAID, so the flow starts
# with "Solo abono" locked, collects "Solo interés" to cover it, then comes
# back and finds "Solo abono" available — which is the whole behavior under
# test, reached through the app rather than by seeding a special fixture.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${DEV_URL}
    commands:
      - extendedWaitUntil:
          visible: "Development Build"
          timeout: 20000
      - openLink: ${DEV_URL}
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 45000
      - runFlow:
          when:
            true: ${DEV_MENU_DISMISS}
          commands:
            - back
      - runFlow:
          when:
            true: ${DEV_MENU_CONTINUE}
          commands:
            - tapOn:
                text: "Continue"
                optional: true
- extendedWaitUntil:
    visible: "Crea tu PIN"
    timeout: 30000
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- extendedWaitUntil:
    visible: "Confirma tu PIN"
    timeout: 10000
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- extendedWaitUntil:
    visible: "Ahora no, tal vez después"
    timeout: 15000
- tapOn: "Ahora no, tal vez después"
- extendedWaitUntil:
    visible: "Hola, Carlos."
    timeout: 15000
# Demo video: pass -e RECORD=true to save videos/credito-abierto-solo-capital.mp4 (recording starts after the PIN preamble).
- runFlow:
    when:
      true: ${RECORD}
    commands:
      - startRecording: videos/credito-abierto-solo-capital

- tapOn:
    id: "tab-buscar"
- extendedWaitUntil:
    visible: "Buscar cliente"
    timeout: 15000
- tapOn: "Nombre, teléfono o cédula…"
- inputText: "Luis"
- extendedWaitUntil:
    visible: ".*Luis Pérez.*"
    timeout: 15000
- tapOn: ".*Luis Pérez.*"
- extendedWaitUntil:
    visible: "PRÉSTAMOS ACTIVOS"
    timeout: 15000
- tapOn: ".*Préstamo #L-00011.*"

# Open-credit loan detail shows the cycle history, not "TOTAL A PAGAR HOY".
- extendedWaitUntil:
    visible: "CAPITAL PENDIENTE"
    timeout: 15000
- tapOn: "Cobrar"

# The cycle's interest is still owed, so Solo abono is locked and says why.
# It's the third option card, below the fold on first render — never run
# before this issue (#106), so the flow didn't account for that.
- extendedWaitUntil:
    visible: "OPCIONES DE PAGO"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Solo abono.*"
    direction: DOWN
    speed: 20
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 90
- assertVisible: ".*Solo abono.*"
- assertVisible: ".*Disponible al cubrir el interés del ciclo.*"

# Collect the cycle's interest with the default option. The CTA text is
# dynamic ("Confirmar pago RD$<amount>") on the open-credit branch, not the
# static "Confirmar y cobrar" the term-loan branch uses — never run before
# this issue (#106).
- tapOn: ".*Confirmar pago.*"
- extendedWaitUntil:
    visible: "¡Pago registrado!"
    timeout: 15000
- tapOn: "Listo"

# Back on the loan, collect again — now the interest is covered.
- extendedWaitUntil:
    visible: "CAPITAL PENDIENTE"
    timeout: 15000
- tapOn: "Cobrar"
- extendedWaitUntil:
    visible: "OPCIONES DE PAGO"
    timeout: 15000

# The note appears, the interest options are spent, and Solo abono is live.
- assertVisible: "El interés de este ciclo ya fue pagado"
- assertVisible: ".*Ya cubierto en este ciclo.*"
- scrollUntilVisible:
    element:
      text: ".*Solo abono.*"
    direction: DOWN
    speed: 20
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 90
- tapOn: ".*Solo abono.*"
# Selecting the card resets scroll position back to the top (layout shift
# from the newly-revealed capital input), so the "Abono" input
# needs its own scroll — never run before this issue (#106).
- scrollUntilVisible:
    element:
      text: ".*Abono.*"
    direction: DOWN
    speed: 20
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 90
- assertVisible: ".*Abono.*"
# This is where the flow stops: the "Solo abono" unlocking behavior this
# flow exists to prove is now confirmed end-to-end. Completing an actual
# custom-amount capital payment from here would need typing into the
# "Abono" TextInput, but it's nested inside an accessible
# Pressable that iOS merges into one opaque VoiceOver element — the input
# has no independently addressable text, testID (tried — see
# components/screens/CollectPaymentScreen.tsx's oc-capital-input, added for
# this and still unreachable), or stable relative position once nested this
# way. That's a real accessibility gap for VoiceOver users too, not just a
# Maestro limitation — a sighted-but-assistive-tech user hits the exact same
# wall reaching this field. Worth its own fix (e.g. accessible={false} on
# the option card while it's expanded, so the nested input becomes its own
# focus target), tracked as a follow-up rather than attempted here with a
# fragile coordinate-based tap.
- runFlow:
    when:
      true: ${RECORD}
    commands:
      - stopRecording
