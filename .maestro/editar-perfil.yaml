# Covers: Hoy -> Mi cuenta -> Editar perfil -> change name, business and phone ->
# Guardar cambios -> the new name shows on Mi cuenta.
#
# Requires a build with EXPO_PUBLIC_USE_MOCK_REPOS=true and
# EXPO_PUBLIC_USE_FAKE_GOOGLE=true (see pin-unlock.yaml). The fake Google
# sheet (components/FakeGoogleSignIn.tsx) stands in for Google's own account
# chooser and consent screen; approving always succeeds. Pass -e RECORD=true
# to save videos/editar-perfil.mp4.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${DEV_URL}
    commands:
      - extendedWaitUntil:
          visible: "Development Build"
          timeout: 20000
      - openLink: ${DEV_URL}
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 45000
      - runFlow:
          when:
            true: ${DEV_MENU_DISMISS}
          commands:
            - back
- extendedWaitUntil:
    visible: "Crea tu PIN"
    timeout: 30000
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- extendedWaitUntil:
    visible: "Confirma tu PIN"
    timeout: 10000
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- extendedWaitUntil:
    visible: "Ahora no, tal vez después"
    timeout: 15000
- tapOn: "Ahora no, tal vez después"
- extendedWaitUntil:
    visible: "Hola, Carlos."
    timeout: 15000
- runFlow:
    when:
      true: ${RECORD}
    commands:
      - startRecording: videos/editar-perfil
- tapOn:
    id: "home-avatar-button"
- extendedWaitUntil:
    visible: "Mi cuenta"
    timeout: 15000
- tapOn: "Editar perfil"
- extendedWaitUntil:
    visible: "Editar perfil"
    timeout: 15000
- tapOn:
    id: "profile-name"
- eraseText: 30
- inputText: "Carlos Martínez"
- tapOn:
    id: "profile-business"
- inputText: "Préstamos Martínez"
- tapOn:
    id: "profile-phone"
- inputText: "8095550123"
- tapOn: "Guardar cambios"
- extendedWaitUntil:
    visible: "Mi cuenta"
    timeout: 15000
- assertVisible: ".*Carlos Martínez.*"
- runFlow:
    when:
      true: ${RECORD}
    commands:
      - stopRecording
