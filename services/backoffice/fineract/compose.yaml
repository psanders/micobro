# Local Apache Fineract for the Phase 1 live suite (`npm run backoffice:live`).
# Not used by the app or by `npm test` — the default test run uses the
# in-memory FakeFineract. Credentials below are local-only defaults.
name: micobro-fineract
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD: fineract
    # Published for the back office's own database (micobro_backoffice).
    ports:
      - "5433:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineract"]
      interval: 5s
      retries: 20
  fineract:
    # Pinned to the develop build the Phase 1 observations were recorded on
    # (git 1e84eeb, 2026-11-03). Apache publishes no 1.13+ release tags on
    # Docker Hub; move this deliberately and re-run `npm run backoffice:live`.
    image: apache/fineract@sha256:953b989ea7c26aeb6dda6152994797b4c0c3ec36539dc3434f6c93e59d6f8a3e
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      FINERACT_NODE_ID: "1"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: fineract
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: fineract
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: America/Santo_Domingo
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Micobro POC tenant
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: -Xmx1G
volumes:
  pgdata:
